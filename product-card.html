<!-- Product Card Component Template -->
<div class="product-card sticker sticker-hover bg-joy-panel rounded-2xl overflow-hidden flex flex-col h-full" data-sold="{{sold}}">
  <div class="relative">
    <div class="product-carousel slide-carousel overflow-hidden relative border-b-[3px] border-joy-outline bg-white" data-images='{{images_json}}'>
      <div class="carousel-track flex transition-transform duration-700" style="will-change: transform; {{sold_style}}">{{carousel_images}}</div>
      {{#if sold}}<span class="absolute top-3 left-1/2 -translate-x-1/2 -rotate-6 bg-joy-pink text-white font-display font-extrabold text-lg px-4 py-1 sticker-sm z-20 pointer-events-none tracking-widest">VENDIDO</span>{{/if}}
      <div class="carousel-dots absolute bottom-2 left-1/2 -translate-x-1/2 flex space-x-1.5"></div>
    </div>
    <div class="absolute top-2 right-2 {{badge_bg}} text-white text-[10px] font-mono font-bold px-2.5 py-1 sticker-sm tracking-wider">{{badge}}</div>
  </div>
  <div class="p-5 flex-1 flex flex-col">
    <h3 class="font-display font-extrabold text-xl leading-tight text-joy-ink">{{name}}</h3>
    <p class="text-joy-muted text-sm font-semibold mt-1">{{description}}</p>
    <div class="mt-auto pt-4 mt-4 border-t-2 border-dashed border-joy-line flex items-baseline gap-2 flex-wrap">
      <span class="font-mono text-2xl font-bold text-joy-ink">{{price}}</span>
      <span class="font-mono text-xs font-bold text-green-600 dark:text-green-400">{{installments}}</span>
    </div>
    {{#if free_shipping}}<p class="text-green-600 dark:text-green-400 font-mono text-xs font-bold mt-2 flex items-center gap-1"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5.05 3.636a1 1 0 010 1.414 7 7 0 000 9.9 1 1 0 01-1.414 1.414 9 9 0 010-12.728 1 1 0 011.414 0zm9.9 0a1 1 0 011.414 0 9 9 0 010 12.728 1 1 0 01-1.414-1.414 7 7 0 010-9.9 1 1 0 010-1.414zM7.879 6.464a1 1 0 010 1.414 3 3 0 000 4.243 1 1 0 01-1.415 1.414 5 5 0 010-7.07 1 1 0 011.415 0zm4.242 0a1 1 0 011.415 0 5 5 0 010 7.072 1 1 0 01-1.415-1.415 3 3 0 000-4.242 1 1 0 011.415 0z" clip-rule="evenodd"/></svg>FRETE GRÁTIS</p>{{/if}}
  </div>
  <button class="w-full {{sold_btn_bg}} font-display font-extrabold text-base py-3.5 px-4 flex items-center justify-center gap-2 border-t-[3px] border-joy-outline transition-all {{sold_btn_extra}}" {{sold_btn_disabled}}>
    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.031-.967-.273-.099-.471-.148-.67.15-.198.297-.767.966-.94 1.164-.173.198-.347.223-.644.075-.297-.149-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.447-.52.149-.174.198-.298.298-.497.099-.198.05-.372-.025-.521-.075-.149-.669-1.611-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.007-.372-.009-.571-.009-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.363.71.306 1.263.489 1.694.626.712.227 1.36.195 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.288.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 6.617h-.001a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.455 4.436-9.89 9.892-9.89 2.64 0 5.122 1.03 6.988 2.898a9.825 6.994 0 012.896 6.994c-.003 5.455-4.438 9.89-9.896 9.89m8.413-18.304A11.815 11.815 0 0012.05.003C5.495.003.002 5.495 0 12.053c0 2.125.557 4.199 1.615 6.032L.057 23.953a1 1 0 001.237 1.237l5.92-1.552a11.882 11.882 0 005.683 1.448h.005c6.555 0 11.848-5.492 11.85-12.048a11.82 11.82 0 00-3.473-8.591"/></svg>
    {{sold_btn_text}}
  </button>
</div>
